<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - RR Academy</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .contact-form {
      background: #fff;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .contact-form label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    .contact-form button {
      background: #1d3557;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }
    .contact-form button:hover {
      background: #457b9d;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="notes.html">Notes</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <section>
      <p>कोई सुझाव या सवाल हो तो हमें ईमेल करें: <strong>rracademyfirozabad@gmail.com</strong></p>
      <p>या Google Form भरें: <a href="#" target="_blank">Click here</a></p>
    </section>
    <section class="contact-form">
      <h2>Send Us a Message</h2>
      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your email" required>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <footer>
    &copy; 2025 RR Academy Firozabad. All Rights Reserved.
  </footer>
</body>
</html>
